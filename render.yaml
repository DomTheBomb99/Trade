services:
  - type: web
    name: multi-agent-paper-trader
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    # If your repo has this code in a subfolder, set rootDir in the Render dashboard.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CREWAI_LLM_MODEL
        value: gpt-4o-mini
      - key: PYTHONUNBUFFERED
        value: "1"
